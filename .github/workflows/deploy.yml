name: Deploy to EC2

on:
  push:
    branches: [main, develop]

jobs:
  test:
    name: ✅ Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashsale
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: flashsale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashsale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --no-coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://flashsale:testpassword@localhost:5432/flashsale_test

  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ ! -d "/app/flashsale-backend" ]; then
              mkdir -p /app
              git clone https://github.com/iamskedy/Flashsale-backend-monorepo.git /app/flashsale-backend
            fi

            cd /app/flashsale-backend
            git fetch origin
            git checkout main
            git pull origin main

            npm ci
            npm run build
            npm prune --omit=dev

            pm2 describe flashsale > /dev/null 2>&1 \
              && pm2 restart flashsale \
              || pm2 start dist/server.js --name flashsale

            pm2 save
            echo "✅ Deploy complete"